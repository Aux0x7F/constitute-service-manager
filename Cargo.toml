[package]
name = "constitute-service-manager"
version = "0.1.0"
edition = "2024"

[lib]
name = "constitute_service_manager"
path = "src/lib.rs"

[[bin]]
name = "constitute-service-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
constitute-fabric = { git = "https://github.com/Aux0x7F/constitute-fabric", branch = "0x/fabric-transition/hardening-posture" }
constitute-protocol = { git = "https://github.com/Aux0x7F/constitute-protocol", branch = "0x/fabric-transition/hardening-posture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
